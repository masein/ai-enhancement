# GRPO / RLVR.  python -m aienh grpo runs/<sft-run>/model.pt --config configs/grpo.yaml
iterations: 80
prompts_per_iter: 8
group_size: 8           # G. Bigger G = lower-variance advantages, linear cost.
mu: 1                   # gradient steps per sampled batch. >1 makes clipping matter.
lr: 2.0e-4              # RL wants a lower lr than SFT; instability here is expensive
temperature: 1.0        # rollout temperature. Too low => no exploration, no learning.
max_new_tokens: 6

epsilon_low: 0.2
epsilon_high: 0.28      # DAPO "clip-higher"; set equal to epsilon_low for vanilla PPO clip
beta: 0.0               # KL-to-reference. TRL's current default is 0.0. Raise if the
                        # model's general ability degrades while reward climbs.
scale_rewards: true     # false = Dr. GRPO (no division by group std)
dynamic_sampling: true  # DAPO: drop zero-variance groups
loss_norm: token        # "token" = DAPO normalisation, "sequence" = original GRPO
ratio_mode: token       # "sequence" = GSPO (use this if the policy is MoE)
format_reward: 0.2      # weight of the format component; log components separately

template: "Q: {q}\nA:"
log_every: 5
seed: 1337
