# Supervised fine-tuning.  python -m aienh sft runs/<pretrain-run>/model.pt --config configs/sft.yaml
n_examples: 4000
epochs: 8.0            # 1-3 at real scale. This toy task needs more: measured on the
                       # held-out split, 4 epochs -> 0.085 exact-match, 8 -> 0.365,
                       # 12 -> 0.81. Pick 8 if you want RL to have headroom left.
batch_size: 32
lr: 8.0e-4             # below pretraining (3e-3): you are nudging, not building.
                       # At real scale the rule of thumb is ~1/10 of pretraining;
                       # this task is tiny enough to want more.
weight_decay: 0.0
mask_prompt: true      # false = also train on prompt tokens (try it, measure it)
max_len: 64
template: "Q: {q}\nA:" # THE CONTRACT. Evaluate with this exact string.
eval_every: 25
log_every: 20
seed: 1337
