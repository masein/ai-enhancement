# Offline knowledge distillation.
#   python -m aienh distill runs/<teacher>/model.pt --mode offline --config configs/distill_offline.yaml
mode: offline
steps: 300
batch_size: 32
lr: 1.0e-3
temperature: 2.0     # >1 exposes the teacher's low-probability structure
alpha: 0.9           # weight on the soft (KL) term; 1.0 = pure soft, 0.0 = pure hard
top_k: 16            # stored teacher logits per position. k=1 is just hard labels.
cache_path: runs/teacher_cache.npz
log_every: 20
seed: 1337
