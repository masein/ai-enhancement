# A real W&B sweep file.  wandb sweep configs/sweep.yaml  ->  wandb agent <printed id>
#
# For the dependency-free equivalent (same trials, a for-loop instead of a server):
#   python scripts/sweep_local.py
program: scripts/sweep_entry.py
method: bayes            # grid | random | bayes. bayes needs `metric` and pays off
                         # when one run is expensive.
metric:
  name: eval/points      # must be something you actually log to summary
  goal: maximize
parameters:
  lr:
    distribution: log_uniform_values
    min: 3.0e-4
    max: 1.0e-2
  n_embd:
    values: [96, 192, 288]
  micro_batch_size:
    values: [32, 48, 64]
  moe:
    values: [false, true]
early_terminate:         # hyperband: kill trials that are clearly losing
  type: hyperband
  min_iter: 100
