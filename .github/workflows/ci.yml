# Lint, compile, test, and drive the dashboard in Chromium, on plain runners:
# no GPU, no Hub, no torch. Tests that need either are marked `gpu` / `network`
# and deselected here.
#
# Started by hand (Actions ▸ ci ▸ Run workflow, or `gh workflow run`), on the
# public mirror masein/ai-enhancement, where hosted runners are free and run
# up to 20 jobs at once (HANDOFF.md § 5b). scripts/check.sh runs the same tests
# locally, one after another.
#
# In parallel, and no test left out:
#   lint-unit  ruff, a compile pass, and the unit and API tests on every core
#              (pytest-xdist, -n auto)
#   browser    the dashboard suite in five shards, each its share of
#              `-m dashboard` by the committed .test_durations (pytest-split;
#              HANDOFF § 5b says how to regenerate it)
#   ci         green only when both are: the one result to read
#
# The Docker image build is a separate job, and runs only when asked for
# (build_image): the pytorch base image is multi-GB, and since 12a.5b the image
# also pulls the ~14 GB devel image and compiles two CUDA kernels — more than
# an hour, and more disk than a hosted runner has. A check is the jobs above.
name: ci

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: "also build the service's Docker image (slow; not part of a check)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    # a guard against a hung run, not a budget: serial, these took 13–27 minutes
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: ruff
        run: ruff check .
      - name: py_compile scripts/ service/ clients/
        run: python -m compileall -q scripts service clients
      - name: unit and API tests
        run: pytest -q -n auto -m "not gpu and not network and not dashboard"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false            # every shard reports, so one run shows every failure
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      # the browser download is the slow part; the system libraries it needs
      # are installed every time (apt, not cacheable here)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: playwright chromium
        run: playwright install --with-deps chromium
      - name: dashboard, shard ${{ matrix.shard }} of 5
        run: pytest -q -m dashboard --splits 5 --group ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-screenshots-shard-${{ matrix.shard }}
          path: tests/_screens/
          if-no-files-found: ignore

  ci:
    needs: [lint-unit, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: both jobs green
        run: |
          echo "lint-unit: ${{ needs.lint-unit.result }} · browser: ${{ needs.browser.result }}"
          test "${{ needs.lint-unit.result }}" = success
          test "${{ needs.browser.result }}" = success

  docker-image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build the service image (not pushed)
        run: docker build -t aienh-bench:ci .
