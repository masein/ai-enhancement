# Lint, compile, test, and drive the dashboard in Chromium, on a plain runner:
# no GPU, no Hub, no torch. Tests that need either are marked `gpu` / `network`
# and deselected here.
#
# Manual only since 2026-09-24: the account used its 2,000 Actions minutes, and
# a push or PR now shows a job that never started. scripts/check.sh runs the
# same steps locally and is the gate before a merge (HANDOFF.md § Checks). Run
# this by hand (Actions ▸ ci ▸ Run workflow) when there are minutes to spend.
#
# The Docker image build is a separate job in the same manual run: the pytorch
# base image is multi-GB.
name: ci

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # the browser suite passed 20 minutes with the Reader's tests (11g); the
    # limit is a guard against a hung run, not a budget
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: py_compile scripts/ service/ clients/
        run: python -m compileall -q scripts service clients
      - name: unit and API tests
        run: pytest -q -m "not gpu and not network and not dashboard"
      - name: playwright chromium
        run: playwright install --with-deps chromium
      - name: dashboard smoke
        run: pytest -q -m dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: tests/_screens/
          if-no-files-found: ignore

  docker-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build the service image (not pushed)
        run: docker build -t aienh-bench:ci .
