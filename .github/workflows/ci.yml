# Lint, compile, test, and drive the dashboard in Chromium, on plain runners:
# no GPU, no Hub, no torch. Tests that need either are marked `gpu` / `network`
# and deselected here.
#
# Started by hand (Actions ▸ ci ▸ Run workflow, or `gh workflow run`), on the
# public mirror masein/ai-enhancement, where hosted runners are free and run
# up to 20 jobs at once (HANDOFF.md § 5b). scripts/check.sh runs the same tests
# locally, one after another.
#
# In parallel, and no test left out:
#   lint-unit  ruff and a compile pass, and the unit and API tests in three
#              shards, each on every core (pytest-split by .test_durations,
#              then pytest-xdist -n auto)
#   browser    the dashboard suite in five shards, each its share of
#              `-m dashboard` by the committed .test_durations (pytest-split;
#              HANDOFF § 5b says how to regenerate it)
#   image-deps the image's requirements over a CPU torch, and the imports a
#              run needs (12f.4: lm_eval's local-chat-completions)
#   ci         green only when all three are: the one result to read
#
# The Docker image build is a separate job, and runs only when asked for
# (build_image): the pytorch base image is multi-GB, and since 12v the build
# also fetches the hybrid models' two prebuilt CUDA kernels (718 MB). A check
# is the jobs above; a PR that changes the image runs this too. 15.5: it also
# checks the runner image holds nothing that stays on the server, as
# runner-image.yml does before it pushes ghcr.io/masein/evalboard-runner.
name: ci

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: "also build the service's Docker image (slow; not part of a check)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    # a guard against a hung run, not a budget: serial, the unit tests took 13–27 minutes
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # a 4-core runner gives the workers about 2.3 times one core (they
        # build the fixture tree, which is CPU work), so three machines, not
        # more workers, bring this under the browser shards' time
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: ruff
        if: matrix.shard == 1
        run: ruff check .
      - name: py_compile scripts/ service/ clients/
        if: matrix.shard == 1
        run: python -m compileall -q scripts service clients
      - name: unit and API tests, shard ${{ matrix.shard }} of 3
        run: >-
          pytest -q -n auto --dist worksteal --durations=15
          -m "not gpu and not network and not dashboard"
          --splits 3 --group ${{ matrix.shard }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false            # every shard reports, so one run shows every failure
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: playwright version
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      # the browser download is the slow part; the system libraries it needs
      # are installed every time (apt, not cacheable here)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: playwright chromium
        run: playwright install --with-deps chromium
      - name: dashboard, shard ${{ matrix.shard }} of 5
        run: pytest -q -m dashboard --splits 5 --group ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-screenshots-shard-${{ matrix.shard }}
          path: tests/_screens/
          if-no-files-found: ignore
      # 12d.3: the Playground at 1280 and 400 px, light and dark, whatever the
      # result — the new layout, seen before a deploy; only the shards that
      # ran those tests have any
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-screenshots-shard-${{ matrix.shard }}
          path: tests/_screens/phase12d3/
          if-no-files-found: ignore

  image-deps:
    # 12f.4: the image's Python, as far as a runner holds it — its pinned
    # requirements over a CPU torch (the base image's version) — so an import a
    # run needs and the image lacks (lm_eval's local-chat-completions and its
    # api extra) fails here, not on the server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: torch, the base image's version, for the CPU
        run: pip install "torch==2.11.*" --index-url https://download.pytorch.org/whl/cpu
      - name: the image's requirements
        run: pip install -r requirements.txt pytest httpx
      - name: fla's core, and the triton the image's torch pins (12v)
        # the two compiled kernels are CUDA builds, which a CPU torch can't
        # load: the image's own build imports them (the docker-image job)
        run: pip install "triton==3.6.0" -r requirements-kernels.txt
      - name: what lm_eval's api extra brought
        run: |
          python - <<'PY'
          import importlib.metadata as md, re
          for r in md.requires("lm_eval") or []:
              if re.search(r"extra\s*==\s*['\"]api['\"]", r):
                  d = re.split(r"[\s;<>=!~\[]", r, maxsplit=1)[0]
                  print(f"{d}=={md.version(d)}")
          PY
      - name: NLTK's punkt_tab, as the image fetches it (12q.D)
        run: python scripts/nltk_data.py --dest "$RUNNER_TEMP/nltk_data"
      - name: the imports a run needs
        run: >-
          EVALBOARD_IMAGE_DEPS=1 NLTK_DATA="$RUNNER_TEMP/nltk_data"
          pytest -q -p no:cacheprovider tests/test_image_deps.py

  ci:
    needs: [lint-unit, browser, image-deps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: both jobs green
        run: |
          echo "lint-unit: ${{ needs.lint-unit.result }} · browser: ${{ needs.browser.result }} · image-deps: ${{ needs.image-deps.result }}"
          test "${{ needs.lint-unit.result }}" = success
          test "${{ needs.browser.result }}" = success
          test "${{ needs.image-deps.result }}" = success

  docker-image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: build the service image (not pushed)
        run: docker build -t aienh-bench:ci .
      # 15.1: the rented GPU's image, from the same stages and pins
      - name: build the runner image (not pushed)
        run: |
          docker build --target runner -t aienh-runner:ci .
          docker run --rm aienh-runner:ci | head -5
      # 15.5: what runner-image.yml checks before it pushes the public image
      - name: nothing that stays on the server is in the runner image
        run: python3 scripts/check_runner_image.py aienh-runner:ci
      # 15.6: the two images hold the same packages, at constraints.txt's
      # versions, but for what only the board stage installs; the lists are
      # kept, to make constraints.txt again from (scripts/image_packages.py)
      - name: the board and runner images' packages are the same, and constraints.txt
        run: |
          mkdir -p image-packages
          python3 scripts/image_packages.py list aienh-bench:ci > image-packages/board.txt
          python3 scripts/image_packages.py list aienh-runner:ci > image-packages/runner.txt
          python3 scripts/image_packages.py compare aienh-bench:ci aienh-runner:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-packages
          path: image-packages/
          if-no-files-found: ignore
      - name: the two images' sizes
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'aienh-(bench|runner)'
          docker save aienh-runner:ci | gzip -1 | wc -c | awk '{printf "runner, gzipped as a registry holds it: %.1f GB\n", $1 / 1e9}'
