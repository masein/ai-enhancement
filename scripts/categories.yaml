# The exam's 37 topics, and MMLU's 57 subjects mapped onto them.
#
# The topics are the folders Omar delivered in docs/Knowledge Classification
# (phase 10), named exactly as written; each is an exam task
# (exam_<topic_slug>). The MMLU mapping is the brief's proposal, as written —
# Omar can change it. 13 topics have no MMLU counterpart: the MMLU caution line
# simply does not appear for them.
#
# "We are weak in economics" is a sentence someone can act on; "we are weak in
# high_school_macroeconomics (13 leaderboard-half items)" is not — it is noise
# with a subject name attached. scripts/diagnose.py writes a `categories` block
# per task from this file, beside the raw `groups`, and the dashboard shows
# categories first with the subjects on expand.
#
# Rules, enforced by tests/test_categories.py:
#   * every one of the harness's 57 subjects appears exactly once
#   * the file stays this shape — `category:` lines and `  - subject` lines,
#     nothing else — because scripts/categories.py reads it without pyyaml
#     (these scripts run with the box's system python)
# A subject the harness knows and this file does not rolls into
# `General & Multidisciplinary` and is listed in diagnose.json under
# `unmapped`, so the gap is visible, not silent.

