# The benchmark service on a shared GPU box. Copy .env.example to .env, fill in
# the three values, then:  docker compose up -d --build
#
# Three deliberate choices worth knowing before you change them:
#
#   pid: "host"     The run lock (results/.run.lock) proves liveness by checking
#                   /proc/<pid>. Container and host have separate PID namespaces,
#                   so WITHOUT this a containerized service would misread a live
#                   host CLI run as a stale lock and race it — the exact failure
#                   the lock exists to prevent. Sharing the host PID namespace
#                   makes the check truthful in both directions.
#
#   path-identical  BENCH_ROOT and HF_HOME are mounted at the SAME path inside
#   volume mounts   the container as on the host. That keeps three things working
#                   at once: the sqlite DB, HF auth (your accepted gemma license
#                   rides in HF_HOME), and eval_tasks/*.yaml files, which pin
#                   their corpus by ABSOLUTE path.
#
#   ports from      The service binds 0.0.0.0 inside the container; the publish
#   ${BIND}         line pins exposure to the Tailscale IP on the host, so the
#                   tailnet reaches it and the LAN does not.

services:
  bench:
    build:
      context: .
      args:
        # EVALBOARD_BUILD=$(git rev-parse --short HEAD) docker compose up -d --build
        EVALBOARD_BUILD: ${EVALBOARD_BUILD:-}
        # 12h.1: the Mamba kernels, tried at build and never required;
        # WITH_MAMBA=0 builds without them
        WITH_MAMBA: ${WITH_MAMBA:-1}
    image: aienh-bench
    pid: "host"
    # the box's loopback, reachable from inside the container: the `local`
    # provider talks to a vLLM bound to 127.0.0.1 on the host. network_mode:
    # host would also reach it and would throw away the ${BIND} publish line
    # that keeps this service off the LAN, so it is the gateway, not host
    # networking.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Dubai}          # display timezone for the page's timestamps
      BENCH_ROOT: ${BENCH_ROOT}
      HF_HOME: ${HF_HOME}
      TITLE: ${TITLE:-Team model benchmark}
      MAX_PARAMS_B: ${MAX_PARAMS_B:-4}
      MAX_JOB_GB: ${MAX_JOB_GB:-10}
      SUBMIT_TOKEN: ${SUBMIT_TOKEN:-}
      ARTIFACT_MAX_GB: ${ARTIFACT_MAX_GB:-8}
      ARTIFACT_QUOTA_GB: ${ARTIFACT_QUOTA_GB:-150}
      # custom model code (trust_remote_code) — off unless all three line up;
      # see SERVICE.md § custom model code before turning this on
      ALLOW_REMOTE_CODE: ${ALLOW_REMOTE_CODE:-0}
      EVAL_USER: ${EVAL_USER:-benchjob}
      REMOTE_CODE_SHAS: ${REMOTE_CODE_SHAS:-}
      # the LLM behind "propose a skill spec" and data generation (batch API
      # only). The key is INTERPOLATED from .env — never a literal here, never
      # in git — and stripped from every evaluation subprocess. It is still
      # visible to anyone with docker access on this box (docker inspect shows
      # Config.Env): protected from submitted code, not from colleagues.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MAX_ITEMS_PER_BATCH: ${LLM_MAX_ITEMS_PER_BATCH:-200}
      LLM_DAILY_ITEM_CAP: ${LLM_DAILY_ITEM_CAP:-2000}
      LOCAL_DAILY_ITEM_CAP: ${LOCAL_DAILY_ITEM_CAP:-}
      DATASET_QUOTA_GB: ${DATASET_QUOTA_GB:-20}
      # the exam writer — a separate identity from the generator (LLM_*) and
      # the judge, so the loop is not one model family grading itself
      EXAM_PROVIDER: ${EXAM_PROVIDER:-}
      EXAM_MODEL: ${EXAM_MODEL:-}
      EXAM_API_KEY: ${EXAM_API_KEY:-}
      # the judge — an API call, batch mode, its own identity; a DATED model id;
      # a different provider from the exam writer and the generator
      # 12i.1: OpenRouter, for the jobs chosen on the AI models page; the key
      # only ever in .env, never here or in a page
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_CANARY_MAX_DRIFT: ${JUDGE_CANARY_MAX_DRIFT:-0.5}
      ALLOW_SINGLE_PROVIDER_LOOP: ${ALLOW_SINGLE_PROVIDER_LOOP:-0}
      ALLOW_PRELIMINARY_OVERRIDE: ${ALLOW_PRELIMINARY_OVERRIDE:-1}
      # the `local` provider (vLLM). Inside this container localhost is the
      # container, so the box's loopback is reached through the host gateway
      # below — vLLM stays bound to 127.0.0.1 on the box and nothing new is
      # exposed. On the host the code default (localhost) is the right one.
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-http://host.docker.internal:8000/v1}
      LOCAL_CONCURRENCY: ${LOCAL_CONCURRENCY:-2}
      LOCAL_MAX_TOKENS: ${LOCAL_MAX_TOKENS:-1024}
      LOCAL_TIMEOUT_S: ${LOCAL_TIMEOUT_S:-180}
    volumes:
      - ${BENCH_ROOT}:${BENCH_ROOT}
      - ${HF_HOME}:${HF_HOME}
    ports:
      - "${BIND}:8899:8899"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
